services:
  # PostgreSQL Database for Admin Service
  postgres:
    image: postgres:15-alpine
    container_name: admin-service-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clan_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clan_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - admin-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: admin-service-redis
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - admin-network

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: admin-service-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin_pass}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - admin-network

  # Admin Service
  admin-service:
    build:
      context: ./services/admin-service
      dockerfile: deploy/Dockerfile
    container_name: admin-service
    ports:
      - "8000:8000"
    environment:
      # Application
      APP_NAME: "Admin Service"
      APP_VERSION: "1.0.0"
      DEBUG: "true"
      ENVIRONMENT: "local"
      
      # Database - PostgreSQL
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-clan_platform}
      
      # Cache - Redis
      REDIS_URL: redis://redis:6379/0
      CACHE_DEFAULT_TTL: 1800
      
      # Database - MongoDB
      MONGODB_URL: mongodb://admin:admin_pass@mongodb:27017
      MONGODB_DB_NAME: clan_platform
      
      # Security
      SECRET_KEY: "your-jwt-secret-key-change-in-production"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # CORS
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'
      
      # Identity Service Integration
      IDENTITY_SERVICE_URL: "http://host.docker.internal:8001"

      # Audit Service (separate repo — runs on host port 8007)
      AUDIT_SERVICE_URL: "http://host.docker.internal:8007"

      # Logging
      LOG_LEVEL: "DEBUG"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./services/admin-service:/app
    networks:
      - admin-network
    restart: unless-stopped


networks:
  admin-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
